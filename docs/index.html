<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI+项目管理 智能信息面板</title>
    <meta name="description" content="实时追踪AI动态 · 发现最佳实践案例 · 提升项目管理技能">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .header h1 {
            font-size: 32px;
            color: #2d3748;
            margin-bottom: 10px;
        }

        .header p {
            color: #718096;
            font-size: 16px;
        }

        .update-time {
            display: inline-block;
            background: #e6fffa;
            color: #047857;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 14px;
            margin-top: 10px;
        }

        .auto-badge {
            display: inline-block;
            background: #fef3c7;
            color: #d97706;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 14px;
            margin-left: 10px;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        @media (max-width: 968px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .panel-header {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f7fafc;
        }

        .panel-icon {
            font-size: 32px;
            margin-right: 15px;
        }

        .panel-title {
            font-size: 24px;
            color: #2d3748;
            font-weight: 600;
        }

        .news-item {
            margin-bottom: 25px;
            padding: 20px;
            background: #f7fafc;
            border-radius: 12px;
            border-left: 4px solid #667eea;
            transition: all 0.3s ease;
        }

        .news-item:hover {
            transform: translateX(5px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
        }

        .news-title {
            font-size: 18px;
            color: #2d3748;
            font-weight: 600;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
        }

        .priority-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            margin-left: 10px;
        }

        .priority-high {
            background: #fee2e2;
            color: #dc2626;
        }

        .priority-medium {
            background: #fef3c7;
            color: #d97706;
        }

        .news-summary {
            color: #4a5568;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .news-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            font-size: 13px;
            color: #a0aec0;
            flex-wrap: wrap;
            gap: 10px;
        }

        .news-tag {
            display: inline-block;
            background: #e0e7ff;
            color: #4f46e5;
            padding: 4px 10px;
            border-radius: 6px;
            margin-right: 6px;
            font-size: 12px;
        }

        .case-item {
            margin-bottom: 25px;
            padding: 20px;
            background: #f0fdf4;
            border-radius: 12px;
            border-left: 4px solid #10b981;
            transition: all 0.3s ease;
        }

        .case-item:hover {
            transform: translateX(5px);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
        }

        .case-title {
            font-size: 18px;
            color: #2d3748;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .case-company {
            display: inline-block;
            background: #d1fae5;
            color: #047857;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .case-description {
            color: #4a5568;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 12px;
        }

        .case-impact {
            background: white;
            padding: 12px;
            border-radius: 8px;
            margin-top: 12px;
        }

        .impact-title {
            font-size: 13px;
            color: #059669;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .impact-value {
            color: #2d3748;
            font-size: 14px;
            line-height: 1.8;
        }

        .stats-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-item {
            flex: 1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-number {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 12px;
            opacity: 0.9;
        }

        .footer {
            text-align: center;
            color: white;
            margin-top: 30px;
            padding: 20px;
            font-size: 14px;
            opacity: 0.9;
        }

        .footer a {
            color: white;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 AI+项目管理 智能信息面板</h1>
            <p>实时追踪AI动态 · 发现最佳实践案例 · 提升项目管理技能</p>
            <span class="update-time">📅 最后更新: 2026年08月22日 03:21</span>
            <span class="auto-badge">🤖 自动更新 · 每天10:30</span>
        </div>

        <div class="stats-bar">
            <div class="stat-item">
                <div class="stat-number">0</div>
                <div class="stat-label">今日AI动态</div>
            </div>
            <div class="stat-item">
                <div class="stat-number">0</div>
                <div class="stat-label">实践案例</div>
            </div>
            <div class="stat-item">
                <div class="stat-number">自动</div>
                <div class="stat-label">智能更新</div>
            </div>
        </div>

        <div class="dashboard">
            <!-- 左侧：AI重要动态 -->
            <div class="panel">
                <div class="panel-header">
                    <span class="panel-icon">🔥</span>
                    <h2 class="panel-title">AI重要动态</h2>
                </div>
                
                <div class="news-item">
                    <div class="news-title">
                        正在获取最新数据...
                        <span class="priority-badge priority-medium">🟡 关注</span>
                    </div>
                    <div class="news-summary">
                        系统正在搜索最新的AI动态，请稍后刷新页面
                    </div>
                    <div class="news-meta">
                        <div>
                            <span class="news-tag">系统提示</span>
                        </div>
                        <span>2026年08月</span>
                    </div>
                </div>
            
            </div>

            <!-- 右侧：AI+项目管理案例 -->
            <div class="panel">
                <div class="panel-header">
                    <span class="panel-icon">💡</span>
                    <h2 class="panel-title">AI+项目管理实践</h2>
                </div>
                
                <div class="case-item">
                    <div class="case-title">正在加载案例...</div>
                    <span class="case-company">技术 · 系统</span>
                    <div class="case-description">
                        正在搜索最新的AI项目管理案例
                    </div>
                    <div class="case-impact">
                        <div class="impact-title">📊 实际效果</div>
                        <div class="impact-value">• 加载中...</div>
                    </div>
                </div>
            
            </div>
        </div>

        <div class="footer">
            <p>⚡ 由阿里云通义千问AI驱动 | 每天10:30自动更新</p>
            <p>🔗 <a href="https://github.com/yourusername/ai-pm-dashboard" target="_blank">查看项目源代码</a></p>
        </div>
    </div>
</body>
</html>
